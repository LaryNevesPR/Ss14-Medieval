- type: entity
  parent: BaseItem
  id: AndroCoinsCobre
  name: Moeda de Cobre
  description: Moedinha
  components:
  - type: Cash
  - type: Item
    shape:
    - 0,0,1,0
    storedOffset: 0,-2
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      AndroCoinCobre: 1
  - type: StaticPrice
    price: 0
  - type: Stack
    stackType: AndroCoinCobre
    count: 1
    baseLayer: base
    layerStates:
    - c0
    - c2
    - c3
    - c5
    - c10
    - c15
    - c19
    layerFunction: Threshold
  - type: StackLayerThreshold
    thresholds: [2, 3, 5, 10, 15, 19]
  - type: Sprite
    sprite: _Andromeda/Objects/Economy/coin.rsi
    state: c0
    layers:
    - state: c0
      map: ["base"]
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        density: 30
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.2,0.25,0.1"
        mask:
        - ItemMask
  - type: Appearance
  - type: CargoSellBlacklist # Frontier

