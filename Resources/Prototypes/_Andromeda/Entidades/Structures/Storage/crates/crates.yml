- type: entity
  parent: CrateGeneric
  id: AndroCrateMadeira
  name: Caixa de madeira
  description: Uma caixa de madeira
  components:
  - type: Sprite
    sprite: _Andromeda/Structures/Storage/Crates/chest_wood1.rsi
    layers:
    - state: crate
      map: ["enum.StorageVisualLayers.Base"]
    - state: crate_door
      map: ["enum.StorageVisualLayers.Door"]
    - state: paper
      sprite: Structures/Storage/Crates/labels.rsi
      offset: "0.0,-0.09375"
      map: ["enum.PaperLabelVisuals.Layer"]
  - type: Icon
    sprite: _Andromeda/Structures/Storage/Crates/chest_wood1.rsi
    state: crate_icon
  - type: Appearance
  - type: EntityStorageVisuals
    stateDoorOpen: crate_open
    stateDoorClosed: crate_door

